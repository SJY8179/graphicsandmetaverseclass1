<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Sierpinski Carpet</title>

<!-- 정점 shader: 받은 좌표를 그대로 clip 좌표로 내보낸다 -->
<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec4 vPosition;

void main()
{
    gl_Position = vPosition;
}
</script>

<!-- 단편 shader: 색을 uniform으로 받는다 (카펫 색, 선 색 모두 이걸로 처리) -->
<script id="fragment-shader" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
#else
    precision mediump float;
#endif

uniform vec4 uColor;

void main()
{
    gl_FragColor = uColor;
}
</script>

<script src="Common/webgl-utils.js"></script>
<script src="Common/initShaders.js"></script>
<script src="Common/MV.js"></script>
<script src="carpet.js"></script>
</head>

<body>
<h3>Sierpinski Carpet</h3>
<canvas id="gl-canvas" width="512" height="512" style="border:1px solid #ccc">
이 브라우저는 HTML5 canvas를 지원하지 않습니다.
</canvas>

<!-- 분할 횟수 제어 -->
<div style="margin-top:12px">
    분할 횟수
    <button id="levelDown">-</button>
    <input id="level" type="range" min="0" max="6" step="1" value="3">
    <button id="levelUp">+</button>
    <span id="levelText">3</span>
</div>

<!-- 색상 제어 -->
<div style="margin-top:8px">
    카펫 색 <input id="carpetColor" type="color" value="#1f5fa8">
    &nbsp; 배경 색 <input id="bgColor" type="color" value="#ffffff">
</div>

<!--  삼각형 분할 표시 -->
<div style="margin-top:8px">
    <label><input id="showEdges" type="checkbox"> 삼각형 분할 표시</label>
</div>
</body>
</html>
